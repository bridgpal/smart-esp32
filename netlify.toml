# Netlify config for the device API. The site lives in site/; firmware/ is never built here.
# Paths below (publish, functions) are relative to the base directory.
[build]
  base = "site"
  publish = "public"
  # Skip the build when a commit doesn't touch site/ (e.g. firmware-only changes). Exit 0 = skip.
  # Always build when there's no earlier commit to compare against (first deploy).
  # Runs from the base directory, so "." means site/ (netlify.toml itself sits outside it).
  ignore = "[ -z \"$CACHED_COMMIT_REF\" ] || [ \"$CACHED_COMMIT_REF\" = \"$COMMIT_REF\" ] && exit 1; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../netlify.toml"

[functions]
  directory = "netlify/functions"
