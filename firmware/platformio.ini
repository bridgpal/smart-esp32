; ESP32-S3 audio board (SMKTelec / Waveshare ESP32-S3-AUDIO-Board compatible)
; Chip: ESP32-S3 QFN56 rev v0.2, 16MB quad flash, 8MB embedded octal PSRAM, native USB-Serial/JTAG.

[platformio]
default_envs = board

[env]
; pioarduino = Arduino core 3.3.12 on ESP-IDF 5.5.5 (the official PlatformIO platform is stuck on core 2.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_build.psram_type = opi
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=3
  '-DFW_VERSION="0.1.0"'
lib_deps =
  bblanchon/ArduinoJson@^7.4.2
  adafruit/Adafruit NeoPixel@^1.15.1
test_framework = unity
test_build_src = yes
test_speed = 115200

[env:board]
